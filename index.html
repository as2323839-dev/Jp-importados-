<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.site{position:relative;width:100%;max-width:1536px;margin:0 auto;line-height:0;background:#000}.site>img{display:block;width:100%;height:auto}.hotspot{position:absolute;z-index:10;display:block;cursor:pointer;border-radius:8px}.hotspot:focus-visible{outline:2px solid #efbd5a;outline-offset:2px}.inicio{left:30%;top:14.5%;width:5.2%;height:5.8%}.produtos{left:35.3%;top:14.5%;width:6.5%;height:5.8%}.categorias{left:42.1%;top:14.5%;width:8.4%;height:5.8%}.sobre{left:52.8%;top:14.5%;width:6.8%;height:5.8%}.contato{left:60.5%;top:14.5%;width:6.7%;height:5.8%}.ver-produtos{left:15%;top:52.2%;width:16.3%;height:7.5%;border-radius:35px}.tenis{left:6.4%;top:83%;width:12.5%;height:13.5%}.roupas{left:19.7%;top:83%;width:12.5%;height:13.5%}.relogios{left:32.1%;top:83%;width:12.7%;height:13.5%}.bolsas{left:44.8%;top:83%;width:12.5%;height:13.5%}.perfumes{left:57.7%;top:83%;width:12.5%;height:13.5%}.oculos{left:70.5%;top:83%;width:12.5%;height:13.5%}.eletronicos{left:83%;top:83%;width:11.5%;height:13.5%}.search{position:absolute;z-index:12;left:29.2%;top:9.1%;width:40.5%;height:4.8%;background:transparent;border:0;outline:0;color:#fff;padding:0 4%;font-size:clamp(10px,1vw,14px);line-height:normal}.search::placeholder{color:transparent}.account-actions{position:absolute;z-index:40;left:84.9%;top:9.7%;width:13.2%;height:9.4%;display:grid;grid-template-columns:1fr 1fr 1.08fr;gap:3%;align-items:center}.icon-btn{position:relative;width:100%;height:100%;border:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:17%;border-radius:8px;line-height:1}.icon-btn:hover,.icon-btn:focus-visible{color:#efbd5a;outline:1px solid #9b6724}.icon-btn svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.cart-badge{position:absolute;right:2%;top:2%;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#e7a934;color:#080808;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:18px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.modal{width:min(1120px,96vw);max-height:92dvh;overflow:auto;background:#080808;border:1px solid #b8791d;border-radius:16px;box-shadow:0 20px 80px rgba(0,0,0,.75);line-height:1.35}.modal-head{position:sticky;top:0;z-index:2;background:#080808;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #35220d}.modal-head h2{margin:0;color:#efbd5a;font-size:22px}.close{border:1px solid #7a4d17;background:#111;color:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:22px}.catalog-info{padding:14px 20px;background:linear-gradient(90deg,#171007,#0b0b0b);border-bottom:1px solid #35220d;color:#f2d28f}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #24170a}.toolbar button{background:#111;color:#efbd5a;border:1px solid #80511b;padding:10px 14px;border-radius:999px;cursor:pointer}.toolbar button.active{background:#dca33b;color:#050505}.products-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:20px}.card{background:#0d0d0d;border:1px solid #5a3712;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#dca33b}.card img{width:100%;height:230px;object-fit:cover;background:#111}.card-body{padding:15px;display:flex;flex-direction:column;gap:9px;flex:1}.card h3{margin:0;color:#fff;font-size:17px}.price{color:#efbd5a;font-size:20px;font-weight:800}.stock{font-size:12px;color:#aaa}.actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}.card button,.product-detail button{flex:1 1 130px;border:1px solid #b77a22;background:#dca33b;color:#080808;padding:10px 12px;border-radius:8px;font-weight:800;cursor:pointer}.card button.secondary,.product-detail button.secondary,.card button.favorite,.product-detail button.favorite{background:#111;color:#efbd5a}.cart-panel,.aboutbox,.contactbox,.product-detail,.profilebox{padding:22px}.product-detail{display:grid;grid-template-columns:minmax(260px,.9fr) 1.1fr;gap:24px}.product-detail img{width:100%;max-height:430px;object-fit:contain;background:#0d0d0d;border:1px solid #4b2f12;border-radius:14px}.product-detail h3{font-size:28px;color:#efbd5a;margin:0 0 8px}.detail-price{font-size:30px;color:#efbd5a;font-weight:900;margin:14px 0}.payment-title{margin:22px 0 10px;color:#efbd5a;font-weight:800}.payments{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}.payment{border:1px solid #80511b;background:#101010;color:#fff;padding:14px 10px;border-radius:10px;cursor:pointer;text-align:center;font-weight:800}.payment.active{background:#dca33b;color:#080808}.cart-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border-bottom:1px solid #2a1d0f;padding:12px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border:1px solid #7f541f;background:#111;color:#efbd5a;border-radius:6px;cursor:pointer}.cart-total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;color:#efbd5a;padding:18px 0}.checkout{width:100%;border:0;background:#dca33b;color:#080808;font-weight:900;padding:14px;border-radius:10px;cursor:pointer;font-size:16px}.continue{width:100%;margin-top:10px;border:1px solid #80511b;background:#111;color:#efbd5a;font-weight:800;padding:12px;border-radius:10px;cursor:pointer}.note{color:#aaa;font-size:12px;margin-top:10px}.empty{padding:30px;color:#aaa;grid-column:1/-1;text-align:center}.aboutbox h3,.contactbox h3,.profilebox h3{color:#efbd5a}.aboutbox a,.contactbox a,.profilebox a{color:#efbd5a}.store-card{background:#0e0e0e;border:1px solid #4a3014;border-radius:14px;padding:18px;margin-top:14px}.store-card p{margin:8px 0}.store-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.store-actions a,.store-actions button{border:1px solid #9b6724;background:#111;color:#efbd5a;border-radius:10px;padding:11px 14px;text-decoration:none;font-weight:800;cursor:pointer}.store-actions .primary{background:#dca33b;color:#080808}.section-title{color:#efbd5a;margin:18px 0 8px;font-size:18px}.checkout-shell{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;padding:22px}.checkout-box{background:#0d0d0d;border:1px solid #4a3014;border-radius:14px;padding:18px}.checkout-box h3{margin:0 0 14px;color:#efbd5a}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.field label{display:block;font-size:12px;color:#d8bd87;margin:0 0 6px}.field input,.field select{width:100%;background:#090909;border:1px solid #5c3d19;color:#fff;border-radius:9px;padding:12px;outline:none}.field input:focus,.field select:focus{border-color:#dca33b}.order-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #2a1d0f}.order-line small{color:#aaa}.checkout-total{display:flex;justify-content:space-between;gap:12px;padding:16px 0;font-size:20px;font-weight:900;color:#efbd5a}.pay-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px}.pay-choice button{border:1px solid #80511b;background:#101010;color:#fff;padding:14px;border-radius:10px;cursor:pointer;font-weight:800}.pay-choice button.active{background:#dca33b;color:#080808}.mp-status{border:1px dashed #80511b;background:#100d08;color:#e8d7b4;padding:13px;border-radius:10px;font-size:13px;margin-bottom:12px}.pay-now{width:100%;border:0;background:#009ee3;color:white;font-weight:900;padding:14px;border-radius:10px;cursor:pointer;font-size:16px}.pay-now:disabled{opacity:.55;cursor:not-allowed}.secure-note{font-size:12px;color:#9b9b9b;margin-top:10px}.checkout-error{color:#ffb0a7;font-size:13px;margin:10px 0;display:none}@media(max-width:850px){.products-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.product-detail,.checkout-shell{grid-template-columns:1fr}}@media(max-width:600px){.products-grid{grid-template-columns:1fr;padding:12px}.overlay{align-items:flex-start;padding:8px}.modal{max-height:96dvh}.payments,.pay-choice,.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.product-detail{padding:14px}.account-actions{left:84.5%;width:13.8%;height:10.2%;top:9.4%}.icon-btn{padding:13%}.cart-badge{transform:scale(.8);transform-origin:top right}.checkout-shell{padding:12px}}
</style>
</head>
<body>
<div class="site" id="inicio">
<img src="site-reference.jpeg" alt="JP Importados">
<input class="search" id="searchInput" aria-label="Pesquisar produtos" placeholder="Pesquisar produtos" autocomplete="off">
<a class="hotspot inicio" href="#inicio" aria-label="Início"></a>
<a class="hotspot produtos" href="#" onclick="openProducts();return false" aria-label="Produtos"></a>
<a class="hotspot categorias" href="#" onclick="openProducts();return false" aria-label="Categorias"></a>
<a class="hotspot sobre" href="#" onclick="openAbout();return false" aria-label="Sobre nós"></a>
<a class="hotspot contato" href="#" onclick="openContact();return false" aria-label="Contato"></a>
<div class="account-actions" aria-label="Atalhos da loja">
<button class="icon-btn" type="button" onclick="openProfile()" aria-label="Perfil da JP Importados" title="Perfil da loja"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="10" r="5"></circle><path d="M7 27c0-6 4-10 9-10s9 4 9 10"></path></svg></button>
<button class="icon-btn" type="button" onclick="openFavorites()" aria-label="Favoritos" title="Favoritos"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27S5 20.5 5 11.8C5 7.8 8 5 11.6 5c2.2 0 3.7 1.1 4.4 2.4C16.7 6.1 18.2 5 20.4 5 24 5 27 7.8 27 11.8 27 20.5 16 27 16 27Z"></path></svg></button>
<button class="icon-btn" type="button" onclick="openCart()" aria-label="Carrinho" title="Carrinho"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7h3l2.2 12h12.6l2.3-8H9.2"></path><circle cx="13" cy="25" r="1.5"></circle><circle cx="23" cy="25" r="1.5"></circle></svg><span class="cart-badge" id="cartBadge">0</span></button>
</div>
<a class="hotspot ver-produtos" href="#" onclick="openProducts();return false" aria-label="Ver produtos"></a>
<a class="hotspot tenis" href="#" onclick="openProducts('Tênis');return false" aria-label="Tênis"></a><a class="hotspot roupas" href="#" onclick="openProducts('Roupas');return false" aria-label="Roupas"></a><a class="hotspot relogios" href="#" onclick="openProducts('Relógios');return false" aria-label="Relógios"></a><a class="hotspot bolsas" href="#" onclick="openProducts('Bolsas');return false" aria-label="Bolsas"></a><a class="hotspot perfumes" href="#" onclick="openProducts('Perfumes');return false" aria-label="Perfumes"></a><a class="hotspot oculos" href="#" onclick="openProducts('Óculos');return false" aria-label="Óculos"></a><a class="hotspot eletronicos" href="#" onclick="openProducts('Eletrônicos');return false" aria-label="Eletrônicos"></a>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Catálogo</h2><button class="close" onclick="closeModal()" aria-label="Fechar">×</button></div><div id="modalBody"></div></div></div>
<script>
const WHATSAPP='5511974979901';
const products=[{id:'oculos',name:'Óculos de Sol',category:'Óculos',price:74.90,stock:6,detail:'Óculos com lentes escuras e armação preta',img:'assets/oculos.jpeg'},{id:'relogio-prata',name:'Relógio Prata',category:'Relógios',price:49.90,stock:1,detail:'Modelo prata com pulseira metálica',img:'assets/relogio%20prata.jpeg'},{id:'invictus',name:'Invictus',category:'Perfumes',price:470,stock:2,detail:'Rabanne Eau de Toilette',img:'https://beautyhouse.com/cdn/shop/files/06_0b57df34-cb28-45ba-91d0-44c08423d900.jpg?v=1764117157&width=1600'},{id:'one-million',name:'1 Million',category:'Perfumes',price:544.90,stock:1,detail:'Rabanne Eau de Toilette',img:'https://www.parfuem365.de/media/image/9f/f7/46/3349666007921_1.jpg'},{id:'relogio-dourado',name:'Relógio Dourado',category:'Relógios',price:1190,stock:1,detail:'Modelo dourado robusto',img:'assets/relogio%20dourado.jpeg'},{id:'relogio-dourado-2',name:'Relógio Dourado 2',category:'Relógios',price:1140,stock:1,detail:'Modelo dourado esportivo',img:'assets/relogio%20dourado%202.jpeg'}];
const categories=['Todos','Tênis','Roupas','Relógios','Bolsas','Perfumes','Óculos','Eletrônicos'];let cart={},favorites=[],payment='Pix';try{cart=JSON.parse(localStorage.getItem('jpCart')||'{}')||{}}catch(e){}try{favorites=JSON.parse(localStorage.getItem('jpFavorites')||'[]')||[]}catch(e){}const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function saveCart(){localStorage.setItem('jpCart',JSON.stringify(cart));updateBadge()}function saveFavorites(){localStorage.setItem('jpFavorites',JSON.stringify(favorites))}function updateBadge(){document.getElementById('cartBadge').textContent=Object.values(cart).reduce((a,b)=>a+Number(b||0),0)}function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden'}function closeModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow=''}function favoriteLabel(id){return favorites.includes(id)?'♥ Favoritado':'♡ Favoritar'}function toggleFavorite(id,back='product'){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];saveFavorites();back==='favorites'?openFavorites():openProduct(id)}
function openProducts(category='',search=''){const toolbar=`<div class="catalog-info">Clique em qualquer produto para abrir os detalhes, favoritar e comprar.</div><div class="toolbar">${categories.map(c=>`<button class="${(!category&&c==='Todos')||category===c?'active':''}" onclick="openProducts('${c==='Todos'?'':c}')">${c}</button>`).join('')}<button onclick="openFavorites()">♡ Favoritos</button><button onclick="openCart()">🛒 Carrinho</button></div>`;const q=(search||'').trim().toLowerCase();const list=products.filter(p=>(!category||p.category===category)&&(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||p.detail.toLowerCase().includes(q)));const grid=`<div class="products-grid">${list.length?list.map(p=>`<div class="card" onclick="openProduct('${p.id}')"><img src="${p.img}" alt="${p.name}"><div class="card-body"><h3>${p.name}</h3><div>${p.detail}</div><div class="price">${money(p.price)}</div><div class="stock">${p.stock} unid. em estoque</div><div class="actions"><button onclick="event.stopPropagation();addToCart('${p.id}')">Adicionar ao carrinho</button><button class="favorite" onclick="event.stopPropagation();toggleFavorite('${p.id}','favorites')">${favoriteLabel(p.id)}</button><button class="secondary" onclick="event.stopPropagation();buyNow('${p.id}')">Comprar agora</button></div></div></div>`).join(''):`<div class="empty">Ainda não há produtos cadastrados nesta categoria.</div>`}</div>`;openModal(search?`Busca: ${search}`:(category||'Catálogo de Produtos'),toolbar+grid)}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;openModal(p.name,`<div class="product-detail"><img src="${p.img}" alt="${p.name}"><div><h3>${p.name}</h3><p>${p.detail}</p><div class="detail-price">${money(p.price)}</div><div class="stock">${p.stock} unid. em estoque</div><div class="payment-title">Pagamento no checkout</div><div class="payments"><button class="payment" onclick="payment='Pix';buyNow('${p.id}')">PIX</button><button class="payment" onclick="payment='Cartão';buyNow('${p.id}')">CARTÃO DE CRÉDITO</button></div><div class="actions"><button onclick="addToCart('${p.id}')">Adicionar ao carrinho</button><button class="favorite" onclick="toggleFavorite('${p.id}')">${favoriteLabel(p.id)}</button><button class="secondary" onclick="buyNow('${p.id}')">Comprar agora</button></div><p class="note">Ao comprar, você informa a entrega e escolhe Pix ou cartão dentro do próprio site.</p></div></div>`)}function openFavorites(){const list=products.filter(p=>favorites.includes(p.id));const grid=list.length?`<div class="products-grid">${list.map(p=>`<div class="card" onclick="openProduct('${p.id}')"><img src="${p.img}" alt="${p.name}"><div class="card-body"><h3>${p.name}</h3><div>${p.detail}</div><div class="price">${money(p.price)}</div><div class="actions"><button onclick="event.stopPropagation();addToCart('${p.id}')">Adicionar ao carrinho</button><button class="favorite" onclick="event.stopPropagation();toggleFavorite('${p.id}','favorites')">Remover favorito</button></div></div></div>`).join('')}</div>`:`<div class="empty"><p>Você ainda não adicionou produtos aos favoritos.</p><button class="continue" onclick="openProducts()">VER PRODUTOS</button></div>`;openModal('Favoritos',grid)}function addToCart(id){const p=products.find(x=>x.id===id);if(!p)return;const q=Number(cart[id]||0);if(q>=p.stock)return alert('Quantidade máxima em estoque atingida.');cart[id]=q+1;saveCart();openCart()}function removeOne(id){if(!cart[id])return;cart[id]--;if(cart[id]<=0)delete cart[id];saveCart();openCart()}function addOne(id){const p=products.find(x=>x.id===id);if(!p)return;if(Number(cart[id]||0)>=p.stock)return alert('Quantidade máxima em estoque atingida.');cart[id]=Number(cart[id]||0)+1;saveCart();openCart()}
function openCart(){const ids=Object.keys(cart);if(!ids.length){openModal('Carrinho','<div class="cart-panel"><p>Seu carrinho está vazio.</p><button class="continue" onclick="openProducts()">VER PRODUTOS</button></div>');return}let total=0;const items=ids.map(id=>{const p=products.find(x=>x.id===id);if(!p)return '';const q=Number(cart[id]),sub=p.price*q;total+=sub;return `<div class="cart-item"><div><b>${p.name}</b><br><small>${money(p.price)} cada</small></div><div class="qty"><button onclick="removeOne('${id}')">−</button><b>${q}</b><button onclick="addOne('${id}')">+</button></div><div><b>${money(sub)}</b></div></div>`}).join('');openModal('Seu carrinho',`<div class="cart-panel">${items}<div class="cart-total"><span>Total</span><span>${money(total)}</span></div><button class="checkout" onclick="openCheckout()">FINALIZAR COMPRA</button><button class="continue" onclick="openProducts()">CONTINUAR COMPRANDO</button><div class="note">O checkout abre dentro do site para preencher os dados de entrega e escolher Pix ou cartão.</div></div>`)}
function buyNow(id){const p=products.find(x=>x.id===id);if(!p)return;cart={[id]:1};saveCart();openCheckout()}
function checkoutItems(){const ids=Object.keys(cart);let total=0;const lines=ids.map(id=>{const p=products.find(x=>x.id===id);if(!p)return '';const q=Number(cart[id]||0),sub=p.price*q;total+=sub;return `<div class="order-line"><div><b>${p.name}</b><br><small>${q} x ${money(p.price)}</small></div><b>${money(sub)}</b></div>`}).join('');return{lines,total}}
function setCheckoutPayment(method){payment=method;openCheckout(true)}
function validateCheckout(){const ids=['nome','cpf','telefone','email','cep','rua','numero','bairro','cidade','estado'];let ok=true;ids.forEach(id=>{const el=document.getElementById('co-'+id);if(!el||!el.value.trim())ok=false});const err=document.getElementById('checkoutError');if(err){err.style.display=ok?'none':'block';err.textContent='Preencha todos os campos obrigatórios antes de continuar.'}return ok}
function submitCheckout(){if(!validateCheckout())return;const status=document.getElementById('mpStatus');if(status){status.innerHTML='<b>Checkout pronto.</b> Para gerar o Pix ou processar o cartão de verdade, falta conectar o backend seguro do Mercado Pago. O Access Token não pode ficar neste site público.'}const btn=document.getElementById('payNowBtn');if(btn)btn.textContent='AGUARDANDO ATIVAÇÃO DO MERCADO PAGO'}
function openCheckout(keep=false){const ids=Object.keys(cart);if(!ids.length){openCart();return}const old={};if(keep){['nome','cpf','telefone','email','cep','rua','numero','complemento','bairro','cidade','estado'].forEach(k=>{const e=document.getElementById('co-'+k);if(e)old[k]=e.value})}const sum=checkoutItems();openModal('Finalizar compra',`<div class="checkout-shell"><div class="checkout-box"><h3>Dados de entrega</h3><div class="form-grid"><div class="field full"><label>Nome completo *</label><input id="co-nome" value="${old.nome||''}" autocomplete="name"></div><div class="field"><label>CPF *</label><input id="co-cpf" value="${old.cpf||''}" inputmode="numeric"></div><div class="field"><label>Telefone *</label><input id="co-telefone" value="${old.telefone||''}" autocomplete="tel"></div><div class="field full"><label>E-mail *</label><input id="co-email" value="${old.email||''}" type="email" autocomplete="email"></div><div class="field"><label>CEP *</label><input id="co-cep" value="${old.cep||''}" inputmode="numeric" autocomplete="postal-code"></div><div class="field"><label>Número *</label><input id="co-numero" value="${old.numero||''}"></div><div class="field full"><label>Rua / Avenida *</label><input id="co-rua" value="${old.rua||''}" autocomplete="street-address"></div><div class="field full"><label>Complemento</label><input id="co-complemento" value="${old.complemento||''}"></div><div class="field"><label>Bairro *</label><input id="co-bairro" value="${old.bairro||''}"></div><div class="field"><label>Cidade *</label><input id="co-cidade" value="${old.cidade||''}" autocomplete="address-level2"></div><div class="field full"><label>Estado *</label><input id="co-estado" value="${old.estado||''}" autocomplete="address-level1"></div></div></div><div class="checkout-box"><h3>Resumo do pedido</h3>${sum.lines}<div class="checkout-total"><span>Total</span><span>${money(sum.total)}</span></div><h3>Pagamento</h3><div class="pay-choice"><button class="${payment==='Pix'?'active':''}" onclick="setCheckoutPayment('Pix')">PIX</button><button class="${payment==='Cartão'?'active':''}" onclick="setCheckoutPayment('Cartão')">CARTÃO DE CRÉDITO</button></div><div class="mp-status" id="mpStatus">Forma selecionada: <b>${payment}</b>. O formulário já está preparado para receber o Mercado Pago.</div><div class="checkout-error" id="checkoutError"></div><button class="pay-now" id="payNowBtn" onclick="submitCheckout()">${payment==='Pix'?'GERAR PIX':'PAGAR COM CARTÃO'}</button><p class="secure-note">Os dados do cartão serão processados pelo Mercado Pago quando a integração segura for ativada. O Access Token nunca será salvo no GitHub público.</p><button class="continue" onclick="openCart()">VOLTAR AO CARRINHO</button></div></div>`)}
function storeAboutContent(){return `<h3 class="section-title">Quem somos</h3><p>A JP Importados nasceu com o objetivo de oferecer produtos selecionados, bom atendimento e uma experiência de compra simples e segura. Nosso compromisso é atender cada cliente com atenção, transparência e praticidade, buscando sempre oferecer qualidade e facilitar a compra do início ao fim.</p><h3 class="section-title">Nossos produtos</h3><p>Na JP Importados, trabalhamos com produtos importados selecionados, buscando unir qualidade, estilo e variedade em um só lugar. Nosso objetivo é oferecer opções diferenciadas para nossos clientes, com atendimento de confiança e uma experiência de compra simples, segura e prática.</p>`}function openProfile(){openModal('Perfil da loja',`<div class="profilebox">${storeAboutContent()}<div class="store-card"><p><b>CNPJ:</b> 32.574.183/0001-45</p><p><b>Endereço:</b> Av. Sapopemba, 14896 – São Rafael, São Paulo – SP</p><p><b>WhatsApp:</b> (11) 97497-9901</p><p><b>Formas de pagamento:</b> Pix e cartão de crédito</p></div><div class="store-actions"><a class="primary" href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">FALAR NO WHATSAPP</a><button onclick="openProducts()">VER PRODUTOS</button></div></div>`)}function openAbout(){openModal('Quem somos',`<div class="aboutbox">${storeAboutContent()}<div class="store-card"><p><b>CNPJ:</b> 32.574.183/0001-45</p><p><b>Endereço:</b> Av. Sapopemba, 14896 – São Rafael, São Paulo – SP</p><p><b>WhatsApp:</b> (11) 97497-9901</p></div></div>`)}function openContact(){openModal('Contato',`<div class="contactbox"><h3>Fale com a JP Importados</h3><p><b>WhatsApp:</b> <a href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">(11) 97497-9901</a></p><p><b>Endereço:</b> Av. Sapopemba, 14896 – São Rafael, São Paulo – SP</p><p><b>CNPJ:</b> 32.574.183/0001-45</p><p><b>Pagamento:</b> Pix e cartão de crédito</p></div>`)}document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter'){const q=this.value.trim();q?openProducts('',q):openProducts()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});updateBadge();
</script>
