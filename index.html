<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Importados</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.stage{position:relative;width:100%;max-width:1536px;margin:0 auto;background:#000}
.stage img{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;background:transparent;border:0;text-indent:-9999px;overflow:hidden;cursor:pointer}
/* menu superior */
.hs-home{left:30.1%;top:14.7%;width:5.7%;height:4.1%}
.hs-products{left:36.2%;top:14.7%;width:7.7%;height:4.1%}
.hs-categories{left:44.6%;top:14.7%;width:8.3%;height:4.1%}
.hs-about{left:54.8%;top:14.7%;width:7.2%;height:4.1%}
.hs-contact{left:62.4%;top:14.7%;width:7.2%;height:4.1%}
/* botão ver produtos */
.hs-view-products{left:14.6%;top:51.5%;width:16.7%;height:6.6%}
/* categorias inferiores */
.hs-tenis{left:6.4%;top:81.4%;width:12.3%;height:12.4%}
.hs-roupas{left:19.7%;top:81.4%;width:12.3%;height:12.4%}
.hs-relogios{left:33.0%;top:81.4%;width:12.3%;height:12.4%}
.hs-bolsas{left:46.3%;top:81.4%;width:12.3%;height:12.4%}
.hs-perfumes{left:59.6%;top:81.4%;width:12.3%;height:12.4%}
.hs-oculos{left:72.9%;top:81.4%;width:12.3%;height:12.4%}
.hs-eletronicos{left:86.2%;top:81.4%;width:7.3%;height:12.4%}
/* catálogo adicionado sem alterar a arte: pequeno hotspot invisível sobre o carrinho */
.hs-catalogo{right:2.4%;top:8.7%;width:4.8%;height:7.2%}
@media(max-width:700px){.stage{min-width:980px;transform-origin:top left}}
</style>
</head>
<body>
<div class="stage">
  <img src="site-reference.jpeg" alt="JP Importados">
  <a class="hotspot hs-home" href="#" aria-label="Início">Início</a>
  <a class="hotspot hs-products" href="JP_Importados_Catalogo_Final_Completo.pdf" target="_blank" aria-label="Produtos">Produtos</a>
  <a class="hotspot hs-categories" href="#categorias" aria-label="Categorias">Categorias</a>
  <a class="hotspot hs-about" href="#sobre" aria-label="Sobre nós">Sobre nós</a>
  <a class="hotspot hs-contact" href="#contato" aria-label="Contato">Contato</a>
  <a class="hotspot hs-view-products" href="JP_Importados_Catalogo_Final_Completo.pdf" target="_blank" aria-label="Ver produtos">Ver Produtos</a>
  <a class="hotspot hs-catalogo" href="JP_Importados_Catalogo_Final_Completo.pdf" target="_blank" aria-label="Catálogo">Catálogo</a>
  <a class="hotspot hs-tenis" href="JP_Importados_Catalogo_Final_Completo.pdf" target="_blank" aria-label="Tênis">Tênis</a>
