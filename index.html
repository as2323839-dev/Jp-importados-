<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>JP Importados</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.site{position:relative;width:100%;max-width:1536px;margin:0 auto;line-height:0;background:#000}.site>img{display:block;width:100%;height:auto}.hotspot{position:absolute;z-index:20;display:block;cursor:pointer;border-radius:8px}.hotspot:focus-visible{outline:2px solid #efbd5a;outline-offset:2px}.inicio{left:30%;top:14.5%;width:5.2%;height:5.8%}.produtos{left:35.3%;top:14.5%;width:6.5%;height:5.8%}.categorias{left:42.1%;top:14.5%;width:8.4%;height:5.8%}.sobre{left:52.8%;top:14.5%;width:6.8%;height:5.8%}.contato{left:60.5%;top:14.5%;width:6.7%;height:5.8%}.profile-hotspot{left:85.8%;top:11.2%;width:3.5%;height:6.5%}.favorite-hotspot{left:89.8%;top:11.2%;width:3.5%;height:6.5%}.cart-hotspot{left:93.7%;top:10.8%;width:4.3%;height:7.2%}.ver-produtos{left:15%;top:52.2%;width:16.3%;height:7.5%;border-radius:35px}.tenis{left:6.4%;top:83%;width:12.5%;height:13.5%}.roupas{left:19.7%;top:83%;width:12.5%;height:13.5%}.relogios{left:32.1%;top:83%;width:12.7%;height:13.5%}.bolsas{left:44.8%;top:83%;width:12.5%;height:13.5%}.perfumes{left:57.7%;top:83%;width:12.5%;height:13.5%}.oculos{left:70.5%;top:83%;width:12.5%;height:13.5%}.eletronicos{left:83%;top:83%;width:11.5%;height:13.5%}.search{position:absolute;z-index:6;left:29.2%;top:9.1%;width:40.5%;height:4.8%;background:transparent;border:0;outline:0;color:#fff;padding:0 4%;font-size:clamp(10px,1vw,14px);line-height:normal}.search::placeholder{color:transparent}.badge{position:absolute;z-index:21;right:3.7%;top:8.1%;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#dca33b;color:#050505;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;line-height:20px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.modal{width:min(1120px,96vw);max-height:92dvh;overflow:auto;background:#080808;border:1px solid #b8791d;border-radius:16px;box-shadow:0 20px 80px rgba(0,0,0,.75);line-height:1.35}.modal-head{position:sticky;top:0;z-index:2;background:#080808;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #35220d}.modal-head h2{margin:0;color:#efbd5a;font-size:22px}.close{border:1px solid #7a4d17;background:#111;color:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:22px}.catalog-info{padding:14px 20px;background:linear-gradient(90deg,#171007,#0b0b0b);border-bottom:1px solid #35220d;color:#f2d28f}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #24170a}.toolbar button,.gold-btn{background:#111;color:#efbd5a;border:1px solid #80511b;padding:10px 14px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.toolbar button.active,.gold-btn.primary{background:#dca33b;color:#050505}.products-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:20px}.card{background:#0d0d0d;border:1px solid #5a3712;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#dca33b;box-shadow:0 0 0 1px #dca33b33,0 15px 35px #000}.card img{width:100%;height:230px;object-fit:cover;background:#111}.card-body{padding:15px;display:flex;flex-direction:column;gap:9px;flex:1}.card h3{margin:0;color:#fff;font-size:17px}.price{color:#efbd5a;font-size:20px;font-weight:800}.stock{font-size:12px;color:#aaa}.actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}.card button,.product-detail button{flex:1 1 130px;border:1px solid #b77a22;background:#dca33b;color:#080808;padding:10px 12px;border-radius:8px;font-weight:800;cursor:pointer}.card button.secondary,.product-detail button.secondary{background:#111;color:#efbd5a}.card button.favorite,.product-detail button.favorite{background:#111;color:#efbd5a;border-color:#80511b}.cart-panel,.aboutbox,.contactbox,.product-detail,.profilebox{padding:22px}.product-detail{display:grid;grid-template-columns:minmax(260px,.9fr) 1.1fr;gap:24px}.product-detail img{width:100%;max-height:430px;object-fit:contain;background:#0d0d0d;border:1px solid #4b2f12;border-radius:14px}.product-detail h3{font-size:28px;color:#efbd5a;margin:0 0 8px}.product-detail .detail-price{font-size:30px;color:#efbd5a;font-weight:900;margin:14px 0}.payment-title{margin:22px 0 10px;color:#efbd5a;font-weight:800}.payments{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.payment{border:1px solid #80511b;background:#101010;color:#fff;padding:14px 10px;border-radius:10px;cursor:pointer;text-align:center;font-weight:800}.payment.active{background:#dca33b;color:#080808;border-color:#efbd5a}.cart-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border-bottom:1px solid #2a1d0f;padding:12px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border:1px solid #7f541f;background:#111;color:#efbd5a;border-radius:6px;cursor:pointer}.cart-total{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;color:#efbd5a;padding:18px 0}.checkout{width:100%;border:0;background:#25D366;color:#071b0d;font-weight:900;padding:14px;border-radius:10px;cursor:pointer;font-size:16px}.continue{width:100%;margin-top:10px;border:1px solid #80511b;background:#111;color:#efbd5a;font-weight:800;padding:12px;border-radius:10px;cursor:pointer}.note{color:#aaa;font-size:12px;margin-top:10px}.empty{padding:30px;color:#aaa;grid-column:1/-1;text-align:center}.aboutbox h3,.contactbox h3,.profilebox h3{color:#efbd5a;margin-top:0}.aboutbox a,.contactbox a,.profilebox a{color:#efbd5a}.store-card{background:#0e0e0e;border:1px solid #4a3014;border-radius:14px;padding:18px;margin-top:14px}.store-card p{margin:8px 0}.store-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.store-actions a,.store-actions button{border:1px solid #9b6724;background:#111;color:#efbd5a;border-radius:10px;padding:11px 14px;text-decoration:none;font-weight:800;cursor:pointer}.store-actions .primary{background:#dca33b;color:#080808}.section-title{color:#efbd5a;margin:18px 0 8px;font-size:18px}@media(max-width:850px){.products-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.product-detail{grid-template-columns:1fr}}@media(max-width:600px){.products-grid{grid-template-columns:1fr;padding:12px}.overlay{align-items:flex-start;padding:8px}.modal{max-height:96dvh;border-radius:12px}.modal-head{padding:14px}.toolbar{padding:12px;gap:8px}.toolbar button{padding:9px 11px;font-size:13px}.card img{height:250px}.cart-item{grid-template-columns:1fr auto}.cart-item>div:last-child{grid-column:1/-1;text-align:right}.badge{transform:scale(.8)}.payments{grid-template-columns:1fr}.product-detail{padding:14px}}
</style>
</head>
<body>
<div class="site" id="inicio">
<img src="site-reference.jpeg" alt="JP Importados">
<input class="search" id="searchInput" aria-label="Pesquisar produtos" placeholder="Pesquisar produtos" autocomplete="off">
<a class="hotspot inicio" href="#inicio" aria-label="Início"></a>
<a class="hotspot produtos" href="#" onclick="openProducts();return false" aria-label="Produtos"></a>
<a class="hotspot categorias" href="#" onclick="openProducts();return false" aria-label="Categorias"></a>
<a class="hotspot sobre" href="#" onclick="openAbout();return false" aria-label="Sobre nós"></a>
<a class="hotspot contato" href="#" onclick="openContact();return false" aria-label="Contato"></a>
<a class="hotspot profile-hotspot" href="#" onclick="openProfile();return false" aria-label="Perfil da JP Importados" title="Perfil da loja"></a>
<a class="hotspot favorite-hotspot" href="#" onclick="openFavorites();return false" aria-label="Favoritos" title="Favoritos"></a>
<a class="hotspot cart-hotspot" href="#" onclick="openCart();return false" aria-label="Carrinho" title="Carrinho"></a>
<a class="hotspot ver-produtos" href="#" onclick="openProducts();return false" aria-label="Ver produtos"></a>
<a class="hotspot tenis" href="#" onclick="openProducts('Tênis');return false" aria-label="Tênis"></a>
<a class="hotspot roupas" href="#" onclick="openProducts('Roupas');return false" aria-label="Roupas"></a>
<a class="hotspot relogios" href="#" onclick="openProducts('Relógios');return false" aria-label="Relógios"></a>
<a class="hotspot bolsas" href="#" onclick="openProducts('Bolsas');return false" aria-label="Bolsas"></a>
<a class="hotspot perfumes" href="#" onclick="openProducts('Perfumes');return false" aria-label="Perfumes"></a>
<a class="hotspot oculos" href="#" onclick="openProducts('Óculos');return false" aria-label="Óculos"></a>
<a class="hotspot eletronicos" href="#" onclick="openProducts('Eletrônicos');return false" aria-label="Eletrônicos"></a>
<div class="badge" id="cartBadge">0</div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Catálogo</h2><button class="close" onclick="closeModal()" aria-label="Fechar">×</button></div><div id="modalBody"></div></div></div>
<script>
const WHATSAPP='5511974979901';
const products=[
{id:'oculos',name:'Óculos de Sol',category:'Óculos',price:74.90,stock:6,detail:'Óculos com lentes escuras e armação preta',img:'assets/oculos.jpeg'},
{id:'relogio-prata',name:'Relógio Prata',category:'Relógios',price:49.90,stock:1,detail:'Modelo prata com pulseira metálica',img:'assets/relogio%20prata.jpeg'},
{id:'invictus',name:'Invictus',category:'Perfumes',price:470,stock:2,detail:'Rabanne Eau de Toilette',img:'https://beautyhouse.com/cdn/shop/files/06_0b57df34-cb28-45ba-91d0-44c08423d900.jpg?v=1764117157&width=1600'},
{id:'one-million',name:'1 Million',category:'Perfumes',price:544.90,stock:1,detail:'Rabanne Eau de Toilette',img:'https://www.parfuem365.de/media/image/9f/f7/46/3349666007921_1.jpg'},
{id:'relogio-dourado',name:'Relógio Dourado',category:'Relógios',price:1190,stock:1,detail:'Modelo dourado robusto',img:'assets/relogio%20dourado.jpeg'},
{id:'relogio-dourado-2',name:'Relógio Dourado 2',category:'Relógios',price:1140,stock:1,detail:'Modelo dourado esportivo',img:'assets/relogio%20dourado%202.jpeg'}
];
const categories=['Todos','Tênis','Roupas','Relógios','Bolsas','Perfumes','Óculos','Eletrônicos'];
let cart={};let favorites=[];let payment='Pix';try{cart=JSON.parse(localStorage.getItem('jpCart')||'{}')||{}}catch(e){}try{favorites=JSON.parse(localStorage.getItem('jpFavorites')||'[]')||[]}catch(e){}
const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function saveCart(){localStorage.setItem('jpCart',JSON.stringify(cart));updateBadge()}
function saveFavorites(){localStorage.setItem('jpFavorites',JSON.stringify(favorites))}
function updateBadge(){document.getElementById('cartBadge').textContent=Object.values(cart).reduce((a,b)=>a+Number(b||0),0)}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow=''}
function favoriteLabel(id){return favorites.includes(id)?'♥ Favoritado':'♡ Favoritar'}
function toggleFavorite(id,back='product'){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];saveFavorites();back==='favorites'?openFavorites():openProduct(id)}
function openProducts(category='',search=''){const toolbar=`<div class="catalog-info">Clique em qualquer produto para abrir os detalhes, favoritar e comprar.</div><div class="toolbar">${categories.map(c=>`<button class="${(!category&&c==='Todos')||category===c?'active':''}" onclick="openProducts('${c==='Todos'?'':c}')">${c}</button>`).join('')}<button onclick="openFavorites()">♡ Favoritos</button><button onclick="openCart()">🛒 Carrinho</button></div>`;const q=(search||'').trim().toLowerCase();const list=products.filter(p=>(!category||p.category===category)&&(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||p.detail.toLowerCase().includes(q)));const grid=`<div class="products-grid">${list.length?list.map(p=>`<div class="card" onclick="openProduct('${p.id}')"><img src="${p.img}" alt="${p.name}" loading="lazy"><div class="card-body"><h3>${p.name}</h3><div>${p.detail}</div><div class="price">${money(p.price)}</div><div class="stock">${p.stock} unid. em estoque</div><div class="actions"><button onclick="event.stopPropagation();addToCart('${p.id}')">Adicionar ao carrinho</button><button class="favorite" onclick="event.stopPropagation();toggleFavorite('${p.id}','favorites')">${favoriteLabel(p.id)}</button><button class="secondary" onclick="event.stopPropagation();buyNow('${p.id}')">Comprar agora</button></div></div></div>`).join(''):`<div class="empty">Ainda não há produtos cadastrados nesta categoria.</div>`}</div>`;openModal(search?`Busca: ${search}`:(category||'Catálogo de Produtos'),toolbar+grid)}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;openModal(p.name,`<div class="product-detail"><img src="${p.img}" alt="${p.name}"><div><h3>${p.name}</h3><p>${p.detail}</p><div class="detail-price">${money(p.price)}</div><div class="stock">${p.stock} unid. em estoque</div><div class="payment-title">Formas de pagamento</div><div class="payments"><button class="payment ${payment==='Pix'?'active':''}" onclick="setPayment('Pix','${p.id}')">PIX</button><button class="payment ${payment==='Mastercard'?'active':''}" onclick="setPayment('Mastercard','${p.id}')">MASTERCARD</button><button class="payment ${payment==='Visa'?'active':''}" onclick="setPayment('Visa','${p.id}')">VISA</button></div><div class="actions"><button onclick="addToCart('${p.id}')">Adicionar ao carrinho</button><button class="favorite" onclick="toggleFavorite('${p.id}')">${favoriteLabel(p.id)}</button><button class="secondary" onclick="buyNow('${p.id}')">Comprar agora</button></div><p class="note">A forma escolhida será enviada no pedido. O pagamento é confirmado com a JP Importados pelo WhatsApp.</p></div></div>`)}
function openFavorites(){const list=products.filter(p=>favorites.includes(p.id));const grid=list.length?`<div class="products-grid">${list.map(p=>`<div class="card" onclick="openProduct('${p.id}')"><img src="${p.img}" alt="${p.name}"><div class="card-body"><h3>${p.name}</h3><div>${p.detail}</div><div class="price">${money(p.price)}</div><div class="actions"><button onclick="event.stopPropagation();addToCart('${p.id}')">Adicionar ao carrinho</button><button class="favorite" onclick="event.stopPropagation();toggleFavorite('${p.id}','favorites')">Remover favorito</button></div></div></div>`).join('')}</div>`:`<div class="empty"><p>Você ainda não adicionou produtos aos favoritos.</p><button class="continue" onclick="openProducts()">VER PRODUTOS</button></div>`;openModal('Favoritos',grid)}
function setPayment(method,id){payment=method;openProduct(id)}
function addToCart(id){const p=products.find(x=>x.id===id);if(!p)return;const q=Number(cart[id]||0);if(q>=p.stock)return alert('Quantidade máxima em estoque atingida.');cart[id]=q+1;saveCart();openCart()}
function removeOne(id){if(!cart[id])return;cart[id]--;if(cart[id]<=0)delete cart[id];saveCart();openCart()}
function addOne(id){const p=products.find(x=>x.id===id);if(!p)return;if(Number(cart[id]||0)>=p.stock)return alert('Quantidade máxima em estoque atingida.');cart[id]=Number(cart[id]||0)+1;saveCart();openCart()}
function selectPayment(method){payment=method;openCart()}
function openCart(){const ids=Object.keys(cart);if(!ids.length){openModal('Carrinho','<div class="cart-panel"><p>Seu carrinho está vazio.</p><button class="continue" onclick="openProducts()">VER PRODUTOS</button></div>');return}let total=0;const items=ids.map(id=>{const p=products.find(x=>x.id===id);if(!p)return '';const q=Number(cart[id]),sub=p.price*q;total+=sub;return `<div class="cart-item"><div><b>${p.name}</b><br><small>${money(p.price)} cada</small></div><div class="qty"><button onclick="removeOne('${id}')">−</button><b>${q}</b><button onclick="addOne('${id}')">+</button></div><div><b>${money(sub)}</b></div></div>`}).join('');openModal('Seu carrinho',`<div class="cart-panel">${items}<div class="cart-total"><span>Total</span><span>${money(total)}</span></div><div class="payment-title">Escolha a forma de pagamento</div><div class="payments"><button class="payment ${payment==='Pix'?'active':''}" onclick="selectPayment('Pix')">PIX</button><button class="payment ${payment==='Mastercard'?'active':''}" onclick="selectPayment('Mastercard')">MASTERCARD</button><button class="payment ${payment==='Visa'?'active':''}" onclick="selectPayment('Visa')">VISA</button></div><button class="checkout" onclick="checkoutWhatsApp()">FINALIZAR PEDIDO PELO WHATSAPP</button><button class="continue" onclick="openProducts()">CONTINUAR COMPRANDO</button><div class="note">Forma selecionada: <b>${payment}</b>. O site não cobra automaticamente; a JP Importados confirma os dados do pagamento pelo WhatsApp.</div></div>`)}
function checkoutWhatsApp(){const ids=Object.keys(cart);if(!ids.length)return;let total=0,lines=['Olá! Quero fazer este pedido na JP Importados:',''];ids.forEach(id=>{const p=products.find(x=>x.id===id);if(!p)return;const q=Number(cart[id]),sub=p.price*q;total+=sub;lines.push(`• ${p.name} — ${q}x — ${money(sub)}`)});lines.push('',`Total: ${money(total)}`,`Forma de pagamento escolhida: ${payment}`,'','Pode confirmar disponibilidade, entrega e os dados para pagamento?');window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(lines.join('\n'))}`,'_blank','noopener')}
function buyNow(id){const p=products.find(x=>x.id===id);if(!p)return;const msg=`Olá! Tenho interesse em comprar:\n\n• ${p.name}\n• Valor: ${money(p.price)}\n• Pagamento: ${payment}\n\nPode confirmar disponibilidade, entrega e os dados para pagamento?`;window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank','noopener')}
function storeAboutContent(){return `<h3 class="section-title">Quem somos</h3><p>A JP Importados nasceu com o objetivo de oferecer produtos selecionados, bom atendimento e uma experiência de compra simples e segura. Nosso compromisso é atender cada cliente com atenção, transparência e praticidade, buscando sempre oferecer qualidade e facilitar a compra do início ao fim.</p><h3 class="section-title">Nossos produtos</h3><p>Na JP Importados, trabalhamos com produtos importados selecionados, buscando unir qualidade, estilo e variedade em um só lugar. Nosso objetivo é oferecer opções diferenciadas para nossos clientes, com atendimento de confiança e uma experiência de compra simples, segura e prática.</p>`}
function openProfile(){openModal('Perfil da loja',`<div class="profilebox">${storeAboutContent()}<div class="store-card"><p><b>CNPJ:</b> 32.574.183/0001-45</p><p><b>Endereço:</b> Av. Sapopemba, 14896 – São Rafael, São Paulo – SP</p><p><b>WhatsApp:</b> (11) 97497-9901</p><p><b>Formas de pagamento:</b> Pix, Mastercard e Visa</p></div><div class="store-actions"><a class="primary" href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">FALAR NO WHATSAPP</a><button onclick="openProducts()">VER PRODUTOS</button></div></div>`)}
function openAbout(){openModal('Quem somos',`<div class="aboutbox">${storeAboutContent()}<div class="store-card"><p><b>CNPJ:</b> 32.574.183/0001-45</p><p><b>Endereço:</b> Av. Sapopemba, 14896 – São Rafael, São Paulo – SP</p><p><b>WhatsApp:</b> (11) 97497-9901</p></div></div>`)}
function openContact(){openModal('Contato',`<div class="contactbox"><h3>Fale com a JP Importados</h3><p><b>WhatsApp:</b> <a href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">(11) 97497-9901</a></p><p><b>Endereço:</b> Av. Sapopemba, 14896 – São Rafael, São Paulo – SP</p><p><b>CNPJ:</b> 32.574.183/0001-45</p><p><b>Pagamento:</b> Pix, Mastercard e Visa</p></div>`)}
document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter'){const q=this.value.trim();q?openProducts('',q):openProducts()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});updateBadge();
</script>
</body>
</html>
